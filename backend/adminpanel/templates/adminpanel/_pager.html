{% if page.paginator.num_pages > 1 %}
<div class="pager">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?{% if qstr %}{{ qstr }}&{% endif %}page={{ page.previous_page_number }}">← Prev</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?{% if qstr %}{{ qstr }}&{% endif %}page={{ page.next_page_number }}">Next →</a>{% endif %}
</div>
{% endif %}
