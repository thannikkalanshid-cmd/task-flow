<style>
:root{
  --bg:#070b18;--panel:#0f1830;--panel2:#16224a;--line:#26345f;--text:#eaf0ff;--muted:#8f9cc0;
  --accent:#6366f1;--accent2:#a5b4fc;--violet:#8b5cf6;--cyan:#22d3ee;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#38bdf8;
  --surface:linear-gradient(160deg,#16224a 0%,#0f1830 60%);
  --lift:0 1px 0 rgba(255,255,255,.07) inset,0 18px 36px -18px rgba(0,0,0,.85),0 4px 10px -4px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(900px 500px at 8% -8%,rgba(99,102,241,.28),transparent 60%),
             radial-gradient(800px 480px at 100% 0%,rgba(34,211,238,.14),transparent 55%),
             radial-gradient(700px 500px at 60% 110%,rgba(139,92,246,.18),transparent 60%),var(--bg);
  background-attachment:fixed}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:24px;margin:0;letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,0,0,.45)}
h2{font-size:16px;margin:0 0 12px}

/* layout */
.layout{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:20px 14px;
  background:linear-gradient(180deg,rgba(22,34,74,.92),rgba(10,16,36,.96));
  border-right:1px solid var(--line);box-shadow:12px 0 40px -18px rgba(0,0,0,.9),1px 0 0 rgba(255,255,255,.04) inset}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;padding:2px 8px 22px}
.brand span{color:var(--accent2);font-weight:500}
.brand::before{content:"";width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(145deg,#818cf8,#6366f1 50%,#4338ca);
  box-shadow:0 4px 0 #312e81,0 10px 18px rgba(99,102,241,.5),inset 0 2px 0 rgba(255,255,255,.35);transform:rotate(-6deg)}
.side nav a{display:block;padding:10px 14px;margin-bottom:6px;border-radius:11px;color:var(--text);
  border:1px solid transparent;transition:transform .15s,background .15s,box-shadow .15s}
.side nav a:hover{background:rgba(99,102,241,.14);border-color:var(--line);transform:translateX(3px);text-decoration:none}
.side nav a.active{color:#fff;font-weight:600;border-color:rgba(255,255,255,.14);
  background:linear-gradient(145deg,#7c83f7,#5457e6 55%,#4338ca);
  box-shadow:0 4px 0 #2e2a85,0 10px 20px -4px rgba(99,102,241,.55),inset 0 1px 0 rgba(255,255,255,.3);transform:translateY(-2px)}
.main{flex:1;min-width:0}
.top{display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:12px 28px;color:var(--muted);
  background:rgba(7,11,24,.55);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.content{padding:28px;max-width:1260px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:var(--lift)}
.narrow{max-width:660px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));margin-bottom:22px;perspective:900px}
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  box-shadow:var(--lift);transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.stat::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--accent),var(--cyan))}
.stat:hover{transform:rotateX(7deg) rotateY(-7deg) translateY(-5px);border-color:#3b4d86;
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 30px 44px -18px rgba(0,0,0,.9),0 0 28px -6px rgba(99,102,241,.5)}
.stat b{display:block;font-size:28px;letter-spacing:-.02em;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.stat span{color:var(--muted);font-size:12px;letter-spacing:.03em}
.two{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid rgba(38,52,95,.7);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;background:rgba(7,11,24,.35)}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(99,102,241,.09)}
tr:last-child td{border-bottom:0}
td.actions{white-space:nowrap;text-align:right}
.muted{color:var(--muted)}

/* forms: recessed fields */
input,select,textarea{width:100%;background:#050914;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 0 0 3px rgba(99,102,241,.35)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}input[type=file]{padding:8px}
.field{margin-bottom:16px}.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:13px}
.field label.check{display:flex;align-items:center;gap:8px;color:var(--text)}
.field small{display:block;color:var(--muted);margin-top:4px}.err{color:#fca5a5;font-size:13px;margin-top:4px}
.has-error input,.has-error select,.has-error textarea{border-color:var(--red)}
.errorlist{list-style:none;padding:0;margin:0 0 10px;color:#fca5a5}

/* buttons: pressable keycaps */
.btn{--c1:#7c83f7;--c2:#4f52e0;--edge:#2e2a85;--glow:99,102,241;
  display:inline-block;position:relative;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:9px 16px;
  font:inherit;font-weight:600;cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.35);
  background:linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:0 4px 0 var(--edge),0 10px 18px -4px rgba(var(--glow),.5),inset 0 1px 0 rgba(255,255,255,.3);
  transform:translateY(0);transition:transform .1s,box-shadow .1s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px);text-decoration:none;
  box-shadow:0 6px 0 var(--edge),0 16px 24px -6px rgba(var(--glow),.6),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge),0 2px 6px rgba(var(--glow),.4),inset 0 2px 4px rgba(0,0,0,.25)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.btn-sm{padding:4px 11px;font-size:12px;border-radius:9px;box-shadow:0 3px 0 var(--edge),0 6px 12px -4px rgba(var(--glow),.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-sm:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--edge),0 10px 16px -4px rgba(var(--glow),.55),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-sm:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge),inset 0 2px 3px rgba(0,0,0,.25)}
.btn-ghost{--c1:#1d2b57;--c2:#141f42;--edge:#0a1128;--glow:56,189,248;color:var(--text);border-color:var(--line)}
.btn-danger{--c1:#f87171;--c2:#dc2626;--edge:#7f1d1d;--glow:239,68,68}
.btn-warn{--c1:#fbbf24;--c2:#d97706;--edge:#7c3f06;--glow:245,158,11;color:#1f1300;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.btn-ok{--c1:#4ade80;--c2:#16a34a;--edge:#14532d;--glow:34,197,94;color:#03200d;text-shadow:0 1px 0 rgba(255,255,255,.3)}
form.inline{display:inline}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{width:auto;min-width:150px}.toolbar input[name=q]{min-width:250px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}

/* badges, flashes, misc */
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.badge.green{background:#0f3a22;color:#4ade80}.badge.red{background:#471818;color:#fca5a5}
.badge.amber{background:#432d08;color:#fbbf24}.badge.blue{background:#0b3147;color:#7dd3fc}
.flash{padding:12px 16px;border-radius:12px;margin-bottom:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--lift)}
.flash.success{border-color:#166534;background:linear-gradient(160deg,#12361f,#0c2316)}
.flash.error{border-color:#7f1d1d;background:linear-gradient(160deg,#3a1414,#240d0d)}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;color:var(--muted)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
details summary{cursor:pointer;color:var(--accent2);margin-bottom:8px}
pre.note{white-space:pre-wrap;margin:4px 0 0;font:inherit;color:var(--muted)}

/* sign-in */
.stage{min-height:100vh;display:grid;place-items:center;padding:16px;perspective:1100px}
.login{width:100%;max-width:400px;padding:32px;margin:0;transform-style:preserve-3d;transition:transform .15s ease-out;
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 50px 70px -30px rgba(0,0,0,.95),0 0 60px -10px rgba(99,102,241,.4)}
.login .brand{padding:0 0 6px;font-size:22px}
.login p{margin:0 0 20px;color:var(--muted)}
.login .btn{width:100%;margin-top:6px;padding:12px}
.login .err-box{background:#3a1414;border:1px solid #7f1d1d;color:#fca5a5;border-radius:11px;padding:10px 14px;margin-bottom:10px}

@media(max-width:860px){
  .layout{flex-direction:column}
  .side{width:100%;height:auto;position:static;display:flex;gap:10px;align-items:center;overflow-x:auto;padding:12px}
  .brand{padding:0 8px 0 0}.side nav{display:flex;gap:6px}.side nav a{margin:0;white-space:nowrap}
  .two{grid-template-columns:1fr}.content{padding:16px}.top{position:static}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.stat:hover,.btn:hover,.side nav a:hover{transform:none}}
</style>
